
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Victorious - Planning</title>
<style>
:root{--gold:#d4af37;--dark:#100e0a;--panel:#211c12}
*{box-sizing:border-box}
body{margin:0;background:var(--dark);color:#fff;font-family:Arial,sans-serif;padding:16px}
header{text-align:center;padding:22px 0}
.logo{font-size:38px;font-weight:900;color:var(--gold);letter-spacing:4px}
h1{font-size:23px;color:var(--gold);margin:8px}
button,input,select{padding:12px;border-radius:8px;border:1px solid var(--gold);background:#211c12;color:white;font-size:14px}
button{cursor:pointer;background:#332a16}
button:active{opacity:.7}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.panel{background:var(--panel);border:1px solid #806a2c;border-radius:12px;padding:14px;margin:14px 0}
.month{display:flex;justify-content:space-between;align-items:center}
.month strong{color:var(--gold);font-size:18px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.dayname{text-align:center;color:var(--gold);font-size:12px;padding:6px 0}
.day{background:#29251c;border:1px solid #514426;border-radius:5px;min-height:76px;padding:5px 2px;font-size:12px;overflow-wrap:anywhere}
.day.today{border:2px solid var(--gold)}
.day small{color:var(--gold)}
.event{background:#5c491b;padding:4px;margin-top:4px;border-radius:4px;font-size:10px}
input,select{width:100%;margin:5px 0}
h2{color:var(--gold);font-size:17px}
#eventsList p{border-bottom:1px solid #514426;padding:8px}
.muted{color:#b6aa85;font-size:12px}
</style>
</head>
<body>
<header>
<div class="logo">AV</div>
<h1>ALPHA VICTORIOUS</h1>
<div class="muted">PLANNING OFFICIEL</div>
</header>

<div class="panel">
<h2>👤 Mon profil</h2>
<input id="pseudo" placeholder="Ton pseudo">
<button onclick="savePseudo()">Enregistrer mon pseudo</button>
</div>

<div class="actions">
<button onclick="changeMonth(-1)">❮</button>
<button onclick="changeMonth(1)">❯</button>
<button onclick="today()">Aujourd'hui</button>
</div>

<div class="panel">
<div class="month">
<strong id="monthTitle"></strong>
</div>
<div class="calendar" id="calendar"></div>
</div>

<div class="panel">
<h2>➕ Créer un événement</h2>
<input id="eventName" placeholder="Nom du match ou entraînement">
<input id="eventDate" type="date">
<input id="eventTime" type="time">
<select id="eventType">
<option>Entraînement</option>
<option>Scrim</option>
<option>Match officiel</option>
<option>Autre</option>
</select>
<button onclick="addEvent()">Ajouter l'événement</button>
</div>

<div class="panel">
<h2>🟡 Mes disponibilités</h2>
<input id="availDate" type="date">
<label>Heure de début</label>
<input id="start" type="time">
<label>Heure de fin</label>
<input id="end" type="time">
<button onclick="addAvailability()">Enregistrer ma disponibilité</button>
</div>

<div class="panel">
<h2>📅 Événements programmés</h2>
<div id="eventsList"></div>
</div>

<div class="panel">
<h2>🛡️ Joueurs disponibles</h2>
<div id="playersList">Aucune disponibilité enregistrée.</div>
</div>

<script>
let now=new Date();
let year=now.getFullYear(),month=now.getMonth();
let events=JSON.parse(localStorage.getItem("av_events")||"[]");
let avail=JSON.parse(localStorage.getItem("av_avail")||"[]");
let pseudo=localStorage.getItem("av_pseudo")||"";

document.getElementById("pseudo").value=pseudo;
document.getElementById("eventDate").value=new Date().toISOString().slice(0,10);
document.getElementById("availDate").value=new Date().toISOString().slice(0,10);

function save(){
localStorage.setItem("av_events",JSON.stringify(events));
localStorage.setItem("av_avail",JSON.stringify(avail));
}
function savePseudo(){
pseudo=document.getElementById("pseudo").value.trim();
if(!pseudo)return alert("Entre ton pseudo.");
localStorage.setItem("av_pseudo",pseudo);
alert("Pseudo enregistré !");
render();
}
function changeMonth(n){
month+=n;
if(month>11){month=0;year++}
if(month<0){month=11;year--}
render();
}
function today(){let d=new Date();year=d.getFullYear();month=d.getMonth();render()}
function addEvent(){
let name=document.getElementById("eventName").value.trim();
let date=document.getElementById("eventDate").value;
let time=document.getElementById("eventTime").value;
let type=document.getElementById("eventType").value;
if(!name||!date)return alert("Remplis le nom et la date.");
events.push({name,date,time,type});
save();render();
document.getElementById("eventName").value="";
}
function addAvailability(){
if(!pseudo)return alert("Enregistre d'abord ton pseudo.");
let date=document.getElementById("availDate").value;
let start=document.getElementById("start").value;
let end=document.getElementById("end").value;
if(!date||!start||!end)return alert("Complète les horaires.");
avail=avail.filter(a=>!(a.pseudo===pseudo&&a.date===date));
avail.push({pseudo,date,start,end});
save();render();
}
function render(){
let title=new Date(year,month,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
document.getElementById("monthTitle").textContent=title.toUpperCase();
let days=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
let html=days.map(d=>`<div class="dayname">${d}</div>`).join("");
let first=(new Date(year,month,1).getDay()+6)%7;
let count=new Date(year,month+1,0).getDate();
for(let i=0;i<first;i++)html+="<div></div>";
for(let d=1;d<=count;d++){
let date=year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
let ev=events.filter(e=>e.date===date);
html+=`<div class="day ${date===new Date().toISOString().slice(0,10)?"today":""}"><small>${d}</small>${ev.map(e=>`<div class="event">${e.name}</div>`).join("")}</div>`;
}
document.getElementById("calendar").innerHTML=html;
document.getElementById("eventsList").innerHTML=events.length?events.sort((a,b)=>a.date.localeCompare(b.date)).map((e,i)=>`<p><b>${e.date}</b><br>${e.type} : ${e.name} ${e.time||""}</p>`).join(""):"Aucun événement.";
document.getElementById("playersList").innerHTML=avail.length?avail.filter(a=>a.date===new Date().toISOString().slice(0,10)).map(a=>`<p>🟢 ${a.pseudo} : ${a.start} - ${a.end}</p>`).join(""):"Aucune disponibilité aujourd'hui.";
}
render();
</script>
</body>
</html>
